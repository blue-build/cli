---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cli/test-next-gen
description: Test recipe for the BlueBuild Next Gen Builder
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  - type: signing
