name: push-provenance
permissions: {}
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      digests:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push-attestation:
    name: Push provenance attestation
    runs-on: ubuntu-26.04
    permissions:
      packages: write # to push attestation to GHCR
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download SLSA attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}

      - name: Push attestation
        shell: bash
        env:
          IMAGE_DIGESTS: ${{ inputs.digests }}
        run: |
          # Remove the tag from each image ref and append the digest
          image_refs=$(
            jq -r '.[] | "\(.image_ref | split(":")[:-1] | join(":"))@\(.image_digest)"' <<<"${IMAGE_DIGESTS}"
          )
          while IFS= read -r image_ref; do
            oras attach --artifact-type 'application/vnd.in-toto.provenance+dsse' \
              "${image_ref}" 'provenance.intoto.json:application/vnd.dsse.envelope.v1+json'
          done <<<"${image_refs}"
