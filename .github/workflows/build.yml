on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repo:
        required: true
        type: string
      fork_pr:
        default: false
        type: boolean
      is_tag:
        default: false
        type: boolean
      is_latest:
        default: false
        type: boolean
    secrets:
      SIGNING_SECRET:
        required: true
        description: The cosign private key used to sign images
env:
  FORCE_COLOR: 1
  CLICOLOR_FORCE: 1
  RUST_LOG_STYLE: always

permissions: {}

jobs:
  arm64-prebuild:
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write # write pacakges to ghcr

    steps:
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: ${{ ! inputs.fork_pr }}
        with:
          use-cache: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: ${{ ! inputs.fork_pr }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ ! inputs.fork_pr }}
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repo }}


      - name: Login to GitHub Container Registry
        if: ${{ ! inputs.fork_pr }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run build
        if: ${{ ! inputs.fork_pr }}
        id: build
        run: |
          just image-prebuild-publish

  amd64-prebuild:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      packages: write # write pacakges to ghcr

    steps:
      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        if: ${{ ! inputs.fork_pr }}
        with:
          use-cache: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: ${{ ! inputs.fork_pr }}

      # Setup repo and add caching
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ ! inputs.fork_pr }}
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repo }}


      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ ! inputs.fork_pr }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}


      - name: Run build
        id: build
        if: ${{ ! inputs.fork_pr }}
        run: |
          just image-prebuild-publish

  build-images:
    permissions:
      packages: write # push images to ghcr
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.image_manifest_metadata.outputs.digests }}
      digest_list: ${{ steps.image_manifest_metadata.outputs.digest_list }}
    needs:
      - arm64-prebuild
      - amd64-prebuild

    steps:
      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          use-cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Setup repo and add caching
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repo }}


      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ ! inputs.fork_pr }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run build
        if: ${{ ! inputs.fork_pr && ! inputs.is_tag }}
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY}" ]; then
            just image-sign-publish
          else
            just image-publish
          fi

      - name: Run fork build
        if: ${{ inputs.fork_pr && ! inputs.is_tag }}
        run: |
          just image-build

      - name: Run tagged build
        if: ${{ ! inputs.fork_pr && inputs.is_tag && ! inputs.is_latest }}
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          just tagged-image-sign-publish

      - name: Run latest tagged build
        if: ${{ ! inputs.fork_pr && inputs.is_tag && inputs.is_latest }}
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          just latest-tagged-image-sign-publish

      - name: Store image digest info
        if: ${{ ! inputs.fork_pr }}
        id: image_manifest_metadata
        shell: bash
        run: |
          digest_list_json=$(jq -Rc '[ inputs | split(",") | {"image_ref":.[0],"image_digest":.[1]} ]' ./digest-list)
          echo "digests=${digest_list_json}" >>"${GITHUB_OUTPUT}"
          digest_list_csv=$(awk -F, '{ print $2 }' ./digest-list | paste -s -d, -)
          echo "digest_list=${digest_list_csv}" >>"${GITHUB_OUTPUT}"

  # Generate SLSA v1 level 3 build provenance attestation
  provenance:
    if: ${{ ! inputs.fork_pr }}
    needs: [build-images]
    permissions:
      actions: read # to detect the Github Actions environment
      contents: read
      id-token: write # to create OIDC tokens for signing
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@v0.2.2 # zizmor: ignore[unpinned-uses]
    with:
      build-from-source: false
      # renovate: datasource=github-releases depName=slsa-framework/attester
      version: v0.1.2
      watch-jobs: build-images
      collect-artifacts: false
      subjects: ${{ needs.build-images.outputs.digest_list }}
      artifact-name: slsa-provenance

  push-attestation:
    if: ${{ ! inputs.fork_pr }}
    needs: [build-images, provenance]
    permissions:
      packages: write # to push attestation to GHCR
    uses: $/.github/workflows/push-provenance.yml
    with:
      artifact-name: slsa-provenance
      digests: ${{ needs.build-images.outputs.digests }}

  # Generate SLSA v0.2 provenance attestation. This is only needed for
  # backwards compatibility and can be removed later.
  old-provenance:
    if: ${{ ! inputs.fork_pr }}
    needs: [build-images]
    permissions:
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    strategy:
      matrix:
        include: ${{ fromJson(needs.build-images.outputs.digests) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: ${{ matrix.image_ref }}
      digest: ${{ matrix.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
