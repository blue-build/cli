name: Tag Build

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-alpha.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  CLICOLOR_FORCE: 1
  RUST_LOG_STYLE: always

jobs:
  latest-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable

      - name: Run build
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          CARGO_PACKAGE_VERSION="v$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "blue-build") .version')"

          if grep -qE 'rc|beta|alpha' <<<"$CARGO_PACKAGE_VERSION"; then
            LATEST="false"
          else
            LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
            LATEST=$(test "$CARGO_PACKAGE_VERSION" = "$LATEST_TAG" && echo true || echo false)
          fi
          echo "is_latest=$LATEST" >> $GITHUB_OUTPUT
  build:
    uses: $/.github/workflows/build.yml
    needs:
      - latest-detection
    permissions:
      contents: read # read repo contents
      packages: write # write package to ghcr
      id-token: write # docker auth
      actions: read # Provenance
    with:
      repo: ${{ github.repository }}
      ref: ${{ github.ref }}
      is_tag: true
      is_latest: ${{ needs.latest-detection.outputs.is_latest }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
