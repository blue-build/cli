name: PR build

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  test-latest:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.test.outputs.latest }}
    steps:
      - run: echo "latest=true" >> $GITHUB_OUTPUT
        id: test

  test-not-latest:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.test.outputs.latest }}
    steps:
      - run: echo "latest=false" >> $GITHUB_OUTPUT
        id: test

  test-check-latest:
    uses: $/.github/workflows/is-latest-test.yml
    needs:
      - test-latest
    with:
      is_latest: ${{ fromJSON(needs.test-latest.outputs.latest) }}

  test-check-not-latest:
    uses: $/.github/workflows/is-not-latest-test.yml
    needs:
      - test-not-latest
    with:
      is_latest: ${{ fromJSON(needs.test-not-latest.outputs.latest) }}

